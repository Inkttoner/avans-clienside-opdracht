<div class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Quotes</h1>
        @if (isAdmin && isCreateQuote) {
            <input
          type="text"
          [(ngModel)]="newQuoteText"
          placeholder="Enter a new quote"
          class="w-full p-2 border border-gray-300 rounded mb-2"
        />
        <select
          [(ngModel)]="selectedUserId"
          class="w-full p-2 border border-gray-300 rounded mb-2"
        >
          <option *ngFor="let user of users" [value]="user._id">
            {{ user.name }}
          </option>
        </select>
        <button
          class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
          (click)="createQuote()"
        >
          Create Quote
        </button>
        } @else if (isAdmin && !isCreateQuote) {
            <button
          class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600"
          (click)="toggleCreateQuote()"
        >
          Maak een quote
        </button>
        }


      <div class="space-y-6">
        <!-- Loop through quotes -->
        <div
          *ngFor="let quote of quotes"
          class="bg-white shadow-md rounded-lg p-6 border border-gray-200"
        >
          <p class="text-lg italic text-gray-700">"{{ quote.text }}"</p>
          <div class="mt-4 text-right">
            <span class="text-sm text-gray-500">- {{ quote.author }}</span>
          </div>
          <div class="mt-4 flex justify-end space-x-4">
            <button
              class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
              (click)="likeQuote(quote.id)"
            >
              Like
            </button>
            <button
              class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"
              (click)="dislikeQuote(quote.id)"
            >
              Dislike
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
