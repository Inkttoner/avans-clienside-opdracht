<div class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white shadow-lg rounded-lg p-6 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Edit Wedstrijd Details</h1>
        </div>
        <form class="space-y-6" (ngSubmit)="submitGameDetails()">
            <!-- Opponent -->
            <div>
                <label for="opponent" class="block text-sm font-medium text-gray-700">Tegenstander</label>
                <input
                    type="text"
                    id="opponent"
                    name="opponent"
                    [(ngModel)]="game.opponent"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter opponent name"
                    readonly
                />
            </div>

            <!-- Date -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-700">Tijd</label>
                <input
                    type="date"
                    id="date"
                    name="date"
                    [(ngModel)]="dateString"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                />
            </div>

            <!-- Time to Gather -->
            <div>
                <label for="timeToGather" class="block text-sm font-medium text-gray-700">Verzameltijd</label>
                <input
                    type="text"
                    id="timeToGather"
                    name="timeToGather"
                    [(ngModel)]="game.timeToGather"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter gathering time"
                />
            </div>
            <!-- Time -->
            <div>
                <label for="time" class="block text-sm font-medium text-gray-700">Tijd</label>
                <input
                    type="text"
                    id="time"
                    name="time"
                    [(ngModel)]="game.time"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter match time"
                />
            </div>

            <!-- Fee -->
            <div>
                <label for="fee" class="block text-sm font-medium text-gray-700">Vergoeding</label>
                <input
                    type="number"
                    id="fee"
                    name="fee"
                    [(ngModel)]="game.fee"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Enter fee amount"
                />
            </div>

            <!-- Location -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Locatie</label>
                <div class="flex items-center space-x-4 mt-2">
                    <label class="flex items-center">
                        <input
                            type="radio"
                            name="isHomeGame"
                            [value]="true"
                            [(ngModel)]="game.isHomeGame"
                            class="form-radio h-4 w-4 text-blue-600"
                        />
                        <span class="ml-2 text-gray-700">Thuis</span>
                    </label>
                    <label class="flex items-center">
                        <input
                            type="radio"
                            name="isHomeGame"
                            [value]="false"
                            [(ngModel)]="game.isHomeGame"
                            class="form-radio h-4 w-4 text-blue-600"
                        />
                        <span class="ml-2 text-gray-700">Uit</span>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                >
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
